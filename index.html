<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HILDA Spreadsheet</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
<script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

<script src="https://unpkg.com/@univerjs/presets@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/locales/en-US.js"></script>

<link
    rel="stylesheet"
    href="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/index.css"
>

<style>

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: white;
}

#tools {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border-bottom: 1px solid #ddd;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

#tools button {
    padding: 6px 14px;
    border: 1px solid #bbb;
    border-radius: 4px;
    background: white;
    cursor: pointer;
    font-size: 13px;
}

#tools button:hover {
    background: #eee;
}

#tools button:disabled {
    opacity: 0.6;
}

#app {
    width: 100%;
    height: calc(100% - 40px);
    overflow: hidden;
}

#status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    z-index: 9999;
}


/* Filter menu */

#filterMenu {
    position: fixed;
    display: none;
    width: 260px;
    max-height: 420px;
    background: white;
    border: 1px solid #bbb;
    border-radius: 6px;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
    padding: 10px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    z-index: 20000;
}

#filterValues {
    max-height: 280px;
    overflow-y: auto;
    border: 1px solid #ddd;
    margin: 8px 0;
    padding: 5px;
}

.filterValue {
    display: block;
    padding: 3px;
}

.filterActions {
    display: flex;
    justify-content: space-between;
    gap: 6px;
}

.filterActions button {
    padding: 5px 9px;
}

</style>
</head>

<body>

<div id="tools">
    <button id="filterBtn">Filter</button>
    <button id="duplicateBtn">Remove Duplicates</button>
</div>

<div id="app"></div>

<div id="status">
    Loading spreadsheet...
</div>

<div id="filterMenu">

    <div>
        <button id="selectAllFilter">Select All</button>
        <button id="clearAllFilter">Clear</button>
    </div>

    <div id="filterValues"></div>

    <div class="filterActions">
        <button id="cancelFilter">Cancel</button>
        <button id="applyFilter">OK</button>
    </div>

</div>


<script>
(async function () {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const pid =
        params.get("pid");

    if (!pid) {

        document
            .getElementById("status")
            .textContent =
            "Missing participant ID.";

        return;
    }


    /* =====================================
       Configuration
       ===================================== */

    const VERSION =
        "delta_v1";

    const DELTA_KEY =
        "HILDA_" +
        VERSION +
        "_" +
        pid;

    const FILE =
        "./HILDA_COVID_structured_v3.xlsx";


    /* =====================================
       IndexedDB
       ===================================== */

    function openDB() {

        return new Promise(function (resolve, reject) {

            const request =
                indexedDB.open(
                    "HILDA_DELTA_DB",
                    1
                );

            request.onupgradeneeded =
                function (event) {

                    const db =
                        event.target.result;

                    if (
                        !db.objectStoreNames.contains(
                            "deltas"
                        )
                    ) {

                        db.createObjectStore(
                            "deltas"
                        );
                    }
                };

            request.onsuccess =
                function () {

                    resolve(
                        request.result
                    );
                };

            request.onerror =
                function () {

                    reject(
                        request.error
                    );
                };
        });
    }


    async function loadDeltas() {

        const db =
            await openDB();

        return new Promise(function (resolve) {

            const request =
                db
                    .transaction(
                        "deltas",
                        "readonly"
                    )
                    .objectStore(
                        "deltas"
                    )
                    .get(
                        DELTA_KEY
                    );

            request.onsuccess =
                function () {

                    resolve(
                        request.result || {}
                    );
                };

            request.onerror =
                function () {

                    resolve({});
                };
        });
    }


    async function saveDeltas(deltas) {

        const db =
            await openDB();

        return new Promise(function (resolve, reject) {

            const transaction =
                db.transaction(
                    "deltas",
                    "readwrite"
                );

            transaction
                .objectStore(
                    "deltas"
                )
                .put(
                    deltas,
                    DELTA_KEY
                );

            transaction.oncomplete =
                function () {
                    resolve();
                };

            transaction.onerror =
                function () {

                    reject(
                        transaction.error
                    );
                };
        });
    }


    /* =====================================
       Start Univer
       ===================================== */

    const {
        createUniver
    } = UniverPresets;

    const {
        LocaleType,
        mergeLocales
    } = UniverCore;

    const {
        UniverSheetsCorePreset
    } = UniverPresetSheetsCore;


    const {
        univerAPI
    } = createUniver({

        locale:
            LocaleType.EN_US,

        locales: {

            [LocaleType.EN_US]:

                mergeLocales(
                    UniverPresetSheetsCoreEnUS
                )
        },

        presets: [

            UniverSheetsCorePreset({
                container: "app"
            })

        ]
    });


    /* =====================================
       Convert Excel cell
       ===================================== */

    function makeCell(
        source,
        sheetName
    ) {

        if (!source) {
            return null;
        }

        const cell = {};


        /*
         * Excel Commands:
         * formulas remain text.
         */

        if (
            sheetName === "Excel Commands" &&
            source.f
        ) {

            cell.v =
                "=" + source.f;

            return cell;
        }


        if (source.f) {

            cell.f =
                source.f.startsWith("=")
                    ? source.f
                    : "=" + source.f;
        }


        if (
            source.v !== undefined &&
            source.v !== null
        ) {

            cell.v =
                source.v;
        }


        if (
            source.z &&
            source.z !== "General"
        ) {

            cell.s = {

                n: {
                    pattern:
                        source.z
                }
            };
        }


        return cell;
    }


    /* =====================================
       Convert Excel worksheet
       ===================================== */

    function convertSheet(
        worksheet,
        name,
        index
    ) {

        const cellData = {};
        const columnData = {};
        const rowData = {};
        const mergeData = [];

        let rows = 1000;
        let columns = 26;


        if (worksheet["!data"]) {

            const data =
                worksheet["!data"];

            for (
                let r = 0;
                r < data.length;
                r++
            ) {

                const row =
                    data[r];

                if (!row) {
                    continue;
                }


                for (
                    let c = 0;
                    c < row.length;
                    c++
                ) {

                    const source =
                        row[c];

                    if (!source) {
                        continue;
                    }


                    const cell =
                        makeCell(
                            source,
                            name
                        );

                    if (!cell) {
                        continue;
                    }


                    if (!cellData[r]) {
                        cellData[r] = {};
                    }


                    cellData[r][c] =
                        cell;


                    rows =
                        Math.max(
                            rows,
                            r + 1
                        );


                    columns =
                        Math.max(
                            columns,
                            c + 1
                        );
                }
            }

        } else {

            Object.keys(
                worksheet
            ).forEach(function (address) {

                if (
                    address.charAt(0) === "!"
                ) {
                    return;
                }


                const source =
                    worksheet[address];


                const position =
                    XLSX.utils.decode_cell(
                        address
                    );


                const cell =
                    makeCell(
                        source,
                        name
                    );


                if (!cell) {
                    return;
                }


                if (
                    !cellData[
                        position.r
                    ]
                ) {

                    cellData[
                        position.r
                    ] = {};
                }


                cellData[
                    position.r
                ][
                    position.c
                ] = cell;


                rows =
                    Math.max(
                        rows,
                        position.r + 1
                    );


                columns =
                    Math.max(
                        columns,
                        position.c + 1
                    );
            });
        }


        /*
         * Column widths
         */

        if (
            Array.isArray(
                worksheet["!cols"]
            )
        ) {

            worksheet["!cols"]
                .forEach(function (
                    column,
                    i
                ) {

                    if (!column) {
                        return;
                    }


                    let width =
                        column.wpx;


                    if (
                        !width &&
                        column.wch
                    ) {

                        width =
                            Math.round(
                                column.wch * 7 + 5
                            );
                    }


                    if (width) {

                        columnData[i] = {
                            w: width
                        };
                    }
                });
        }


        /*
         * Row heights
         */

        if (
            Array.isArray(
                worksheet["!rows"]
            )
        ) {

            worksheet["!rows"]
                .forEach(function (
                    row,
                    i
                ) {

                    if (!row) {
                        return;
                    }


                    let height =
                        row.hpx;


                    if (
                        !height &&
                        row.hpt
                    ) {

                        height =
                            Math.round(
                                row.hpt *
                                96 / 72
                            );
                    }


                    if (height) {

                        rowData[i] = {
                            h: height
                        };
                    }
                });
        }


        /*
         * Merged cells
         */

        if (
            Array.isArray(
                worksheet["!merges"]
            )
        ) {

            worksheet["!merges"]
                .forEach(function (
                    merge
                ) {

                    mergeData.push({

                        startRow:
                            merge.s.r,

                        endRow:
                            merge.e.r,

                        startColumn:
                            merge.s.c,

                        endColumn:
                            merge.e.c

                    });
                });
        }


        return {

            id:
                "sheet_" +
                index,

            name:
                name,

            rowCount:
                rows,

            columnCount:
                columns,

            defaultColumnWidth:
                88,

            defaultRowHeight:
                22,

            cellData:
                cellData,

            columnData:
                columnData,

            rowData:
                rowData,

            mergeData:
                mergeData,

            showGridlines:
                1,

            rowHeader: {
                width: 46
            },

            columnHeader: {
                height: 20
            }
        };
    }


    /* =====================================
       Load original XLSX
       ===================================== */

    async function loadTemplate() {

        const response =
            await fetch(
                FILE,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Cannot load " +
                FILE
            );
        }


        const buffer =
            await response.arrayBuffer();


        const excel =
            XLSX.read(
                buffer,
                {
                    dense:
                        true,

                    cellFormula:
                        true,

                    cellStyles:
                        true,

                    cellNF:
                        true
                }
            );


        const sheets = {};
        const sheetOrder = [];


        excel.SheetNames.forEach(
            function (
                name,
                index
            ) {

                const converted =
                    convertSheet(
                        excel.Sheets[name],
                        name,
                        index
                    );


                sheets[
                    converted.id
                ] =
                    converted;


                sheetOrder.push(
                    converted.id
                );
            }
        );


        return {

            id:
                "HILDA_" +
                pid,

            name:
                "HILDA Spreadsheet",

            locale:
                LocaleType.EN_US,

            styles:
                {},

            sheetOrder:
                sheetOrder,

            sheets:
                sheets
        };
    }


    /* =====================================
       Helpers
       ===================================== */

    function cloneCell(cell) {

        if (
            cell === null ||
            cell === undefined
        ) {

            return null;
        }


        if (
            typeof structuredClone ===
            "function"
        ) {

            return structuredClone(
                cell
            );
        }


        return JSON.parse(
            JSON.stringify(
                cell
            )
        );
    }


    function valueKey(value) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "__BLANK__";
        }


        if (
            typeof value ===
            "string"
        ) {

            return (
                "s:" +
                value.toLowerCase()
            );
        }


        return (
            typeof value +
            ":" +
            String(value)
        );
    }


    function nextFrame() {

        return new Promise(
            function (resolve) {

                requestAnimationFrame(
                    resolve
                );
            }
        );
    }


    /* =====================================
       Load workbook
       ===================================== */

    try {

        const snapshot =
            await loadTemplate();


        const workbook =
            univerAPI.createWorkbook(
                snapshot
            );


        let deltas =
            await loadDeltas();


        /*
         * Restore participant edits.
         */

        Object.keys(
            deltas
        ).forEach(
            function (sheetName) {

                const worksheet =
                    workbook.getSheetByName(
                        sheetName
                    );


                if (!worksheet) {
                    return;
                }


                const sheetDeltas =
                    deltas[
                        sheetName
                    ];


                Object.keys(
                    sheetDeltas
                ).forEach(
                    function (position) {

                        const parts =
                            position.split(",");


                        const row =
                            Number(
                                parts[0]
                            );


                        const column =
                            Number(
                                parts[1]
                            );


                        const cell =
                            sheetDeltas[
                                position
                            ];


                        const range =
                            worksheet.getRange(
                                row,
                                column
                            );


                        if (
                            cell === null
                        ) {

                            range.setValue(
                                null
                            );

                        } else {

                            range.setValue(
                                cell
                            );
                        }
                    }
                );
            }
        );


        document
            .getElementById(
                "status"
            )
            .style.display =
                "none";


        /* =================================
           DELTA AUTOSAVE
           ================================= */

        let saveTimer =
            null;

        let bulkEditing =
            false;


        function scheduleDeltaSave() {

            clearTimeout(
                saveTimer
            );


            saveTimer =
                setTimeout(
                    function () {

                        saveDeltas(
                            deltas
                        ).catch(
                            console.error
                        );

                    },
                    250
                );
        }


        workbook
            .getSheets()
            .forEach(
                function (
                    worksheet
                ) {

                    const sheetName =
                        worksheet
                            .getSheetName();


                    worksheet
                        .onCellDataChange(
                            function (
                                changedCells
                            ) {

                                if (
                                    bulkEditing
                                ) {
                                    return;
                                }


                                if (
                                    !deltas[
                                        sheetName
                                    ]
                                ) {

                                    deltas[
                                        sheetName
                                    ] = {};
                                }


                                const matrix =
                                    changedCells
                                        .getMatrix();


                                Object.keys(
                                    matrix
                                ).forEach(
                                    function (
                                        rowKey
                                    ) {

                                        const row =
                                            matrix[
                                                rowKey
                                            ];


                                        if (!row) {
                                            return;
                                        }


                                        Object.keys(
                                            row
                                        ).forEach(
                                            function (
                                                columnKey
                                            ) {

                                                deltas[
                                                    sheetName
                                                ][
                                                    rowKey +
                                                    "," +
                                                    columnKey
                                                ] =
                                                    cloneCell(
                                                        row[
                                                            columnKey
                                                        ]
                                                    );
                                            }
                                        );
                                    }
                                );


                                scheduleDeltaSave();
                            }
                        );
                }
            );


        /* =================================
           Selected column
           ================================= */

        function getSelectedColumn(
            sheet
        ) {

            const selection =
                sheet.getSelection();


            if (!selection) {
                return null;
            }


            const range =
                selection
                    .getActiveRange();


            if (!range) {
                return null;
            }


            const info =
                range.getRange();


            if (
                info.startColumn !==
                info.endColumn
            ) {

                return null;
            }


            return info.startColumn;
        }


        function getColumnData(
            sheet,
            column
        ) {

            const dataRange =
                sheet.getDataRange();


            const endRow =
                dataRange
                    .getRange()
                    .endRow;


            const raw =
                sheet
                    .getRange(
                        0,
                        column,
                        endRow + 1,
                        1
                    )
                    .getRawValues();


            const display =
                sheet
                    .getRange(
                        0,
                        column,
                        endRow + 1,
                        1
                    )
                    .getDisplayValues();


            let lastRow =
                raw.length - 1;


            while (
                lastRow > 0 &&
                (
                    raw[lastRow][0] === null ||
                    raw[lastRow][0] === undefined ||
                    raw[lastRow][0] === ""
                )
            ) {

                lastRow--;
            }


            return {
                raw:
                    raw,
                display:
                    display,
                lastRow:
                    lastRow
            };
        }


        /* =================================
           FILTER
           ================================= */

        let filterState =
            null;


        async function clearFilter() {

            if (!filterState) {
                return;
            }


            const sheet =
                workbook.getSheetByName(
                    filterState.sheetName
                );


            if (sheet) {

                for (
                    let i = 0;
                    i <
                    filterState.hiddenRuns.length;
                    i++
                ) {

                    const run =
                        filterState
                            .hiddenRuns[i];


                    sheet.showRows(
                        run.start,
                        run.count
                    );
                }


                sheet.refreshCanvas();
            }


            filterState =
                null;


            document
                .getElementById(
                    "filterMenu"
                )
                .style.display =
                    "none";
        }


        /*
         * Draw ▼ inside row 1 of the
         * filtered column.
         */

        univerAPI
            .getSheetHooks()
            .onCellRender([
                {

                    drawWith:
                        function (
                            ctx,
                            info
                        ) {

                            if (
                                !filterState ||
                                info.row !== 0 ||
                                info.col !==
                                    filterState.column
                            ) {

                                return;
                            }


                            const activeSheet =
                                univerAPI
                                    .getActiveWorkbook()
                                    .getActiveSheet();


                            if (
                                !activeSheet ||
                                activeSheet
                                    .getSheetName() !==
                                    filterState.sheetName
                            ) {

                                return;
                            }


                            const p =
                                info.primaryWithCoord;


                            if (!p) {
                                return;
                            }


                            const right =
                                p.endX !== undefined
                                    ?
                                    p.endX
                                    :
                                    p.startX + 70;


                            ctx.save();

                            ctx.font =
                                "12px Arial";

                            ctx.fillStyle =
                                "#444";

                            ctx.fillText(
                                "▼",
                                right - 14,
                                p.startY + 15
                            );

                            ctx.restore();
                        }
                }
            ]);


        const filterBtn =
            document.getElementById(
                "filterBtn"
            );


        filterBtn.onmousedown =
            function (event) {

                event.preventDefault();
            };


        filterBtn.onclick =
            async function () {

                const sheet =
                    univerAPI
                        .getActiveWorkbook()
                        .getActiveSheet();


                const column =
                    getSelectedColumn(
                        sheet
                    );


                if (
                    column === null
                ) {

                    alert(
                        "Select one column first."
                    );

                    return;
                }


                /*
                 * Clicking Filter again
                 * on same column removes it.
                 */

                if (
                    filterState &&
                    filterState.sheetName ===
                        sheet.getSheetName() &&
                    filterState.column ===
                        column
                ) {

                    await clearFilter();

                    return;
                }


                await clearFilter();


                filterState = {

                    sheetName:
                        sheet.getSheetName(),

                    column:
                        column,

                    hiddenRuns:
                        [],

                    selectedKeys:
                        null
                };


                sheet.refreshCanvas();
            };


        /* =================================
           Click ▼ / row 1
           ================================= */

        univerAPI.addEvent(
            univerAPI.Event.CellClicked,
            function (params) {

                if (!filterState) {
                    return;
                }


                if (
                    params.row !== 0 ||
                    params.column !==
                        filterState.column
                ) {

                    return;
                }


                if (
                    params.worksheet
                        .getSheetName() !==
                    filterState.sheetName
                ) {

                    return;
                }


                openFilterMenu(
                    params.worksheet,
                    filterState.column
                );
            }
        );


        /* =================================
           Filter menu
           ================================= */

        function openFilterMenu(
            sheet,
            column
        ) {

            const data =
                getColumnData(
                    sheet,
                    column
                );


            const options =
                new Map();


            for (
                let r = 1;
                r <= data.lastRow;
                r++
            ) {

                const raw =
                    data.raw[r][0];


                const key =
                    valueKey(
                        raw
                    );


                if (
                    !options.has(
                        key
                    )
                ) {

                    let label =
                        data.display[r][0];


                    if (
                        label === null ||
                        label === undefined ||
                        label === ""
                    ) {

                        label =
                            "(Blanks)";
                    }


                    options.set(
                        key,
                        label
                    );
                }
            }


            /*
             * Prevent a huge DOM menu
             * on ID variables.
             */

            if (
                options.size > 2000
            ) {

                alert(
                    "This column has too many unique values for the quick filter."
                );

                return;
            }


            const menu =
                document.getElementById(
                    "filterMenu"
                );


            const valuesBox =
                document.getElementById(
                    "filterValues"
                );


            valuesBox.innerHTML =
                "";


            const selected =
                filterState
                    .selectedKeys;


            options.forEach(
                function (
                    label,
                    key
                ) {

                    const row =
                        document.createElement(
                            "label"
                        );


                    row.className =
                        "filterValue";


                    const checkbox =
                        document.createElement(
                            "input"
                        );


                    checkbox.type =
                        "checkbox";


                    checkbox.value =
                        key;


                    checkbox.checked =
                        !selected ||
                        selected.has(
                            key
                        );


                    row.appendChild(
                        checkbox
                    );


                    row.appendChild(
                        document.createTextNode(
                            " " + label
                        )
                    );


                    valuesBox.appendChild(
                        row
                    );
                }
            );


            menu.style.left =
                "50%";

            menu.style.top =
                "120px";

            menu.style.transform =
                "translateX(-50%)";

            menu.style.display =
                "block";
        }


        document
            .getElementById(
                "selectAllFilter"
            )
            .onclick =
                function () {

                    document
                        .querySelectorAll(
                            "#filterValues input"
                        )
                        .forEach(
                            function (box) {

                                box.checked =
                                    true;
                            }
                        );
                };


        document
            .getElementById(
                "clearAllFilter"
            )
            .onclick =
                function () {

                    document
                        .querySelectorAll(
                            "#filterValues input"
                        )
                        .forEach(
                            function (box) {

                                box.checked =
                                    false;
                            }
                        );
                };


        document
            .getElementById(
                "cancelFilter"
            )
            .onclick =
                function () {

                    document
                        .getElementById(
                            "filterMenu"
                        )
                        .style.display =
                            "none";
                };


        document
            .getElementById(
                "applyFilter"
            )
            .onclick =
                async function () {

                    if (!filterState) {
                        return;
                    }


                    const sheet =
                        workbook.getSheetByName(
                            filterState.sheetName
                        );


                    const selected =
                        new Set(
                            Array.from(
                                document
                                    .querySelectorAll(
                                        "#filterValues input:checked"
                                    )
                            )
                            .map(
                                function (box) {

                                    return box.value;
                                }
                            )
                        );


                    /*
                     * Restore previous hidden rows.
                     */

                    for (
                        let i = 0;
                        i <
                        filterState.hiddenRuns.length;
                        i++
                    ) {

                        const run =
                            filterState
                                .hiddenRuns[i];


                        sheet.showRows(
                            run.start,
                            run.count
                        );
                    }


                    const data =
                        getColumnData(
                            sheet,
                            filterState.column
                        );


                    const runs =
                        [];


                    let runStart =
                        null;


                    for (
                        let r = 1;
                        r <= data.lastRow;
                        r++
                    ) {

                        const keep =
                            selected.has(
                                valueKey(
                                    data.raw[r][0]
                                )
                            );


                        if (!keep) {

                            if (
                                runStart ===
                                null
                            ) {

                                runStart =
                                    r;
                            }

                        } else if (
                            runStart !==
                            null
                        ) {

                            runs.push({

                                start:
                                    runStart,

                                count:
                                    r -
                                    runStart
                            });


                            runStart =
                                null;
                        }
                    }


                    if (
                        runStart !==
                        null
                    ) {

                        runs.push({

                            start:
                                runStart,

                            count:
                                data.lastRow -
                                runStart +
                                1
                        });
                    }


                    /*
                     * Hide contiguous blocks,
                     * not one row at a time.
                     */

                    for (
                        let i = 0;
                        i < runs.length;
                        i++
                    ) {

                        sheet.hideRows(
                            runs[i].start,
                            runs[i].count
                        );


                        if (
                            i > 0 &&
                            i % 100 === 0
                        ) {

                            await nextFrame();
                        }
                    }


                    filterState
                        .hiddenRuns =
                            runs;


                    filterState
                        .selectedKeys =
                            selected;


                    document
                        .getElementById(
                            "filterMenu"
                        )
                        .style.display =
                            "none";


                    sheet.refreshCanvas();
                };


        /* =================================
           REMOVE DUPLICATES
           Current column only
           ================================= */

        const duplicateBtn =
            document.getElementById(
                "duplicateBtn"
            );


        duplicateBtn.onmousedown =
            function (event) {

                event.preventDefault();
            };


        duplicateBtn.onclick =
            async function () {

                const sheet =
                    univerAPI
                        .getActiveWorkbook()
                        .getActiveSheet();


                const column =
                    getSelectedColumn(
                        sheet
                    );


                if (
                    column === null
                ) {

                    alert(
                        "Select one column first."
                    );

                    return;
                }


                /*
                 * Remove active filtering
                 * before modifying values.
                 */

                if (filterState) {

                    await clearFilter();
                }


                const data =
                    getColumnData(
                        sheet,
                        column
                    );


                if (
                    data.lastRow < 2
                ) {

                    alert(
                        "Not enough data."
                    );

                    return;
                }


                duplicateBtn.disabled =
                    true;


                duplicateBtn.textContent =
                    "Working...";


                await nextFrame();


                try {

                    const range =
                        sheet.getRange(
                            1,
                            column,
                            data.lastRow,
                            1
                        );


                    const raw =
                        range.getRawValues();


                    const cells =
                        range.getCellDatas();


                    const seen =
                        new Set();


                    const uniqueCells =
                        [];


                    for (
                        let i = 0;
                        i < raw.length;
                        i++
                    ) {

                        const key =
                            valueKey(
                                raw[i][0]
                            );


                        if (
                            !seen.has(
                                key
                            )
                        ) {

                            seen.add(
                                key
                            );


                            uniqueCells.push([

                                cloneCell(
                                    cells[i]
                                        ?
                                        cells[i][0]
                                        :
                                        null
                                )

                            ]);
                        }


                        if (
                            i > 0 &&
                            i % 5000 === 0
                        ) {

                            await nextFrame();
                        }
                    }


                    const removed =
                        raw.length -
                        uniqueCells.length;


                    if (
                        removed === 0
                    ) {

                        alert(
                            "No duplicate values found."
                        );

                        return;
                    }


                    /*
                     * One bulk clear +
                     * one bulk write.
                     */

                    bulkEditing =
                        true;


                    try {

                        range.clearContent();


                        sheet.getRange(
                            1,
                            column,
                            uniqueCells.length,
                            1
                        )
                        .setValues(
                            uniqueCells
                        );

                    } finally {

                        bulkEditing =
                            false;
                    }


                    /*
                     * Save only this column
                     * into existing delta model.
                     */

                    const sheetName =
                        sheet.getSheetName();


                    if (
                        !deltas[
                            sheetName
                        ]
                    ) {

                        deltas[
                            sheetName
                        ] = {};
                    }


                    for (
                        let i = 0;
                        i < data.lastRow;
                        i++
                    ) {

                        const cell =
                            i <
                            uniqueCells.length
                                ?
                                uniqueCells[i][0]
                                :
                                null;


                        deltas[
                            sheetName
                        ][
                            (i + 1) +
                            "," +
                            column
                        ] =
                            cloneCell(
                                cell
                            );


                        if (
                            i > 0 &&
                            i % 10000 === 0
                        ) {

                            await nextFrame();
                        }
                    }


                    await saveDeltas(
                        deltas
                    );


                    alert(
                        removed +
                        " duplicate value" +
                        (
                            removed === 1
                                ? ""
                                : "s"
                        ) +
                        " removed."
                    );


                } catch (error) {

                    console.error(
                        error
                    );


                    alert(
                        "Remove Duplicates failed."
                    );

                } finally {

                    bulkEditing =
                        false;


                    duplicateBtn.disabled =
                        false;


                    duplicateBtn.textContent =
                        "Remove Duplicates";
                }
            };


        /* =================================
           Final lightweight save
           ================================= */

        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "hidden"
                ) {

                    clearTimeout(
                        saveTimer
                    );


                    saveDeltas(
                        deltas
                    ).catch(
                        console.error
                    );
                }
            }
        );


        window.addEventListener(
            "pagehide",
            function () {

                clearTimeout(
                    saveTimer
                );


                saveDeltas(
                    deltas
                ).catch(
                    console.error
                );
            }
        );


    } catch (error) {

        console.error(
            error
        );


        document
            .getElementById(
                "status"
            )
            .textContent =

                "Spreadsheet could not be loaded: " +
                error.message;
    }

})();
</script>

</body>
</html>
