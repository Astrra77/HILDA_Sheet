<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HILDA Spreadsheet</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
<script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

<script src="https://unpkg.com/@univerjs/presets@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/locales/en-US.js"></script>

<link rel="stylesheet"
href="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/index.css">

<style>
html,body,#app{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}
#status{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:white;
    font-family:Arial;
    z-index:9999;
}
</style>
</head>

<body>

<div id="app"></div>
<div id="status">Loading spreadsheet...</div>

<script>
(async function(){

const p = new URLSearchParams(location.search);
const pid = p.get("pid");
const sheetID = p.get("sheet");

if(!pid || !sheetID){
    document.getElementById("status").textContent =
        "Missing participant ID or sheet ID.";
    return;
}

const KEY = "HILDA_" + pid + "_" + sheetID;
const FILE = "./data/" + sheetID + ".xlsx";

/* ---------- IndexedDB ---------- */

function db(){
    return new Promise((resolve,reject)=>{
        const r = indexedDB.open("HILDA_DB",1);

        r.onupgradeneeded = e=>{
            const d=e.target.result;
            if(!d.objectStoreNames.contains("workbooks"))
                d.createObjectStore("workbooks");
        };

        r.onsuccess=()=>resolve(r.result);
        r.onerror=()=>reject(r.error);
    });
}

async function getSaved(){
    const d=await db();

    return new Promise(resolve=>{
        const r=d.transaction("workbooks")
                 .objectStore("workbooks")
                 .get(KEY);

        r.onsuccess=()=>resolve(r.result || null);
        r.onerror=()=>resolve(null);
    });
}

async function save(snapshot){
    const d=await db();

    const tx=d.transaction("workbooks","readwrite");
    tx.objectStore("workbooks").put(snapshot,KEY);
}


/* ---------- Start Univer ---------- */

const {createUniver}=UniverPresets;
const {LocaleType,mergeLocales}=UniverCore;
const {UniverSheetsCorePreset}=UniverPresetSheetsCore;

const {univerAPI}=createUniver({
    locale:LocaleType.EN_US,

    locales:{
        [LocaleType.EN_US]:
        mergeLocales(UniverPresetSheetsCoreEnUS)
    },

    presets:[
        UniverSheetsCorePreset({
            container:"app"
        })
    ]
});


/* ---------- Convert XLSX ---------- */

function convertSheet(ws,name,index){

    const cellData={};
    let rows=1000;
    let cols=26;

    Object.keys(ws).forEach(addr=>{

        if(addr[0]==="!") return;

        const c=ws[addr];
        const pos=XLSX.utils.decode_cell(addr);

        rows=Math.max(rows,pos.r+1);
        cols=Math.max(cols,pos.c+1);

        if(!cellData[pos.r])
            cellData[pos.r]={};

        const cell={};

        if(c.f)
            cell.f=c.f.startsWith("=") ? c.f : "="+c.f;

        if(c.v!==undefined)
            cell.v=c.v;

        cellData[pos.r][pos.c]=cell;
    });

    return {
        id:"sheet_"+index,
        name:name,
        rowCount:rows,
        columnCount:cols,
        cellData:cellData
    };
}


async function loadTemplate(){

    const response=await fetch(FILE,{cache:"no-store"});

    if(!response.ok)
        throw new Error("Cannot load "+FILE);

    const buffer=await response.arrayBuffer();
    const xlsx=XLSX.read(buffer,{cellFormula:true});

    const sheets={};
    const sheetOrder=[];

    xlsx.SheetNames.forEach((name,i)=>{

        const s=convertSheet(
            xlsx.Sheets[name],
            name,
            i
        );

        sheets[s.id]=s;
        sheetOrder.push(s.id);
    });

    return {
        id:"HILDA_"+pid+"_"+sheetID,
        name:"HILDA Spreadsheet",
        locale:LocaleType.EN_US,
        styles:{},
        sheetOrder:sheetOrder,
        sheets:sheets
    };
}


/* ---------- Load participant workbook ---------- */

try{

    const saved=await getSaved();
    const snapshot=saved || await loadTemplate();

    const workbook=
        univerAPI.createWorkbook(snapshot);

    document.getElementById("status").style.display="none";


    /* ---------- Autosave ---------- */

    let timer;

    univerAPI.onCommandExecuted(function(){

        clearTimeout(timer);

        timer=setTimeout(function(){
            save(workbook.save());
        },500);

    });

    document.addEventListener("visibilitychange",function(){

        if(document.visibilityState==="hidden")
            save(workbook.save());

    });

}catch(e){

    console.error(e);

    document.getElementById("status").textContent =
        "Spreadsheet could not be loaded.";

}

})();
</script>

</body>
</html>
