<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>HILDA Spreadsheet</title>

  <!-- Required libraries -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
  <script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

  <!-- Univer -->
  <script src="https://unpkg.com/@univerjs/presets@0.25.0/lib/umd/index.js"></script>

  <script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/index.js"></script>

  <script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/locales/en-US.js"></script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/index.css"
  />

  <style>
    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: white;
    }

    #error {
      display: none;
      font-family: Arial, sans-serif;
      padding: 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="app"></div>
<div id="error"></div>

<script>
(function () {

    /*
     * --------------------------------------
     * 1. Read participant ID + sheet ID
     * --------------------------------------
     */

    const params = new URLSearchParams(window.location.search);

    const participantID = params.get("pid");
    const sheetID = params.get("sheet");


    /*
     * Stop if participant ID or sheet ID
     * was not supplied by Qualtrics.
     */

    if (!participantID || !sheetID) {

        document.getElementById("app").style.display = "none";

        const error = document.getElementById("error");

        error.style.display = "block";

        if (!participantID && !sheetID) {
            error.textContent =
                "Missing participant ID and sheet ID.";
        } else if (!participantID) {
            error.textContent =
                "Missing participant ID.";
        } else {
            error.textContent =
                "Missing sheet ID.";
        }

        return;
    }


    /*
     * --------------------------------------
     * 2. Independent storage
     * --------------------------------------
     */

    const STORAGE_KEY =
        "HILDA_UNIVER_SHEET_" +
        participantID +
        "_" +
        sheetID;


    /*
     * ======================================
     * 3. INITIAL DATA FOR THE 7 SHEETS
     * ======================================
     *
     * Replace the sample data below with
     * your actual data.
     *
     * Each inner [...] is ONE ROW.
     *
     * Example:
     *
     * [
     *   ["ID", "Income", "Age"],
     *   [1, 50000, 25],
     *   [2, 60000, 30]
     * ]
     *
     * Formulas can also be included:
     *
     * ["Total", "=SUM(B2:B10)"]
     *
     */

    const DEFAULT_DATA = {


        /*
         * ----------------------------------
         * Standalone spreadsheet
         * ----------------------------------
         */

        standalone: [

            ["Column A", "Column B", "Column C"],
            [1, 10, 100],
            [2, 20, 200],
            [3, 30, 300]

        ],


        /*
         * ----------------------------------
         * Task 1
         * ----------------------------------
         */

        task1: [

            ["A", "B"],
            [1, 6],
            [2, 7],
            [3, 8],
            [4, 8],
            [5, 10]

        ],


        /*
         * ----------------------------------
         * Task 2
         * ----------------------------------
         */

        task2: [

            ["Column A", "Column B"],
            [10, 20],
            [30, 40],
            [50, 60]

        ],


        /*
         * ----------------------------------
         * Task 3
         * ----------------------------------
         */

        task3: [

            ["Column A", "Column B"],
            [100, 200],
            [300, 400],
            [500, 600]

        ],


        /*
         * ----------------------------------
         * Task 4
         * ----------------------------------
         */

        task4: [

            ["Column A", "Column B"],
            [5, 15],
            [25, 35],
            [45, 55]

        ],


        /*
         * ----------------------------------
         * Task 5
         * ----------------------------------
         */

        task5: [

            ["Column A", "Column B"],
            [2, 4],
            [6, 8],
            [10, 12]

        ],


        /*
         * ----------------------------------
         * Task 6
         * ----------------------------------
         */

        task6: [

            ["Column A", "Column B"],
            [11, 22],
            [33, 44],
            [55, 66]

        ]

    };


    /*
     * --------------------------------------
     * 4. Start Univer
     * --------------------------------------
     */

    const { createUniver } = UniverPresets;

    const {
        LocaleType,
        mergeLocales
    } = UniverCore;

    const {
        UniverSheetsCorePreset
    } = UniverPresetSheetsCore;


    const { univerAPI } = createUniver({

        locale: LocaleType.EN_US,

        locales: {
            [LocaleType.EN_US]:
                mergeLocales(
                    UniverPresetSheetsCoreEnUS
                )
        },

        presets: [
            UniverSheetsCorePreset({
                container: "app"
            })
        ]

    });


    /*
     * --------------------------------------
     * 5. Load participant's saved sheet
     * --------------------------------------
     */

    let savedWorkbook = null;

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (saved) {
            savedWorkbook = JSON.parse(saved);
        }

    } catch (e) {

        console.error(
            "Could not load saved spreadsheet:",
            e
        );

    }


    /*
     * --------------------------------------
     * 6. Create workbook
     * --------------------------------------
     */

    let workbook;

    if (savedWorkbook) {

        /*
         * This participant has already
         * edited this particular sheet.
         *
         * Restore their own saved version.
         */

        workbook =
            univerAPI.createWorkbook(
                savedWorkbook
            );

    } else {

        /*
         * First time this participant
         * opens this particular sheet.
         */

        workbook =
            univerAPI.createWorkbook({
                name: "Participant Spreadsheet"
            });


        /*
         * Get initial data corresponding
         * to standalone / task1 / ... task6
         */

        const initialData =
            DEFAULT_DATA[sheetID];


        if (
            initialData &&
            initialData.length > 0
        ) {

            const worksheet =
                workbook.getActiveSheet();


            /*
             * Number of rows
             */

            const rowCount =
                initialData.length;


            /*
             * Find widest row
             */

            const columnCount =
                Math.max.apply(
                    null,
                    initialData.map(function (row) {
                        return row.length;
                    })
                );


            /*
             * Make every row same width.
             */

            const rectangularData =
                initialData.map(function (row) {

                    const copy =
                        row.slice();

                    while (
                        copy.length <
                        columnCount
                    ) {
                        copy.push("");
                    }

                    return copy;
                });


            /*
             * Convert:
             *
             * 1  -> A
             * 2  -> B
             * 26 -> Z
             * 27 -> AA
             */

            function columnLetter(number) {

                var result = "";

                while (number > 0) {

                    var remainder =
                        (number - 1) % 26;

                    result =
                        String.fromCharCode(
                            65 + remainder
                        ) +
                        result;

                    number =
                        Math.floor(
                            (number - 1) / 26
                        );
                }

                return result;
            }


            const endColumn =
                columnLetter(
                    columnCount
                );


            /*
             * Example:
             *
             * 5 rows, 3 columns
             * becomes:
             *
             * A1:C5
             */

            const rangeAddress =
                "A1:" +
                endColumn +
                rowCount;


            /*
             * Insert initial dataset
             */

            worksheet
                .getRange(rangeAddress)
                .setValues(
                    rectangularData
                );

        }

    }


    /*
     * --------------------------------------
     * 7. Autosave
     * --------------------------------------
     */

    let saveTimer = null;

    function saveSpreadsheet() {

        clearTimeout(saveTimer);

        saveTimer = setTimeout(function () {

            try {

                const snapshot =
                    workbook.save();

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(snapshot)
                );

            } catch (e) {

                console.error(
                    "Could not save spreadsheet:",
                    e
                );

            }

        }, 300);

    }


    /*
     * Save whenever Univer executes
     * an editing / formatting command.
     */

    univerAPI.onCommandExecuted(
        function () {

            saveSpreadsheet();

        }
    );


    /*
     * Save one final time when page closes
     * or Qualtrics moves to next page.
     */

    window.addEventListener(
        "beforeunload",
        function () {

            try {

                const snapshot =
                    workbook.save();

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(snapshot)
                );

            } catch (e) {

                console.error(
                    "Final spreadsheet save failed:",
                    e
                );

            }

        }
    );

})();
</script>

</body>
</html>
