<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HILDA Spreadsheet</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
<script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

<script src="https://unpkg.com/@univerjs/presets@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/locales/en-US.js"></script>

<link
    rel="stylesheet"
    href="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/index.css"
>

<style>
html,
body,
#app {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: white;
}

#status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    z-index: 9999;
}
</style>
</head>

<body>

<div id="app"></div>
<div id="status">Loading spreadsheet...</div>

<script>
(async function () {

    const params =
        new URLSearchParams(window.location.search);

    const pid =
        params.get("pid");

    if (!pid) {
        document.getElementById("status").textContent =
            "Missing participant ID.";
        return;
    }


    /* =====================================
       Configuration
       ===================================== */

    const VERSION = "delta_v1";

    const DELTA_KEY =
        "HILDA_" +
        VERSION +
        "_" +
        pid;

    const FILE =
        "./HILDA_COVID_structured_v3.xlsx";


    /* =====================================
       IndexedDB
       Only stores changed cells
       ===================================== */

    function openDB() {

        return new Promise(function (resolve, reject) {

            const request =
                indexedDB.open(
                    "HILDA_DELTA_DB",
                    1
                );

            request.onupgradeneeded =
                function (event) {

                    const db =
                        event.target.result;

                    if (
                        !db.objectStoreNames.contains(
                            "deltas"
                        )
                    ) {
                        db.createObjectStore(
                            "deltas"
                        );
                    }
                };

            request.onsuccess =
                function () {
                    resolve(request.result);
                };

            request.onerror =
                function () {
                    reject(request.error);
                };
        });
    }


    async function loadDeltas() {

        const db =
            await openDB();

        return new Promise(function (resolve) {

            const request =
                db
                .transaction(
                    "deltas",
                    "readonly"
                )
                .objectStore(
                    "deltas"
                )
                .get(DELTA_KEY);

            request.onsuccess =
                function () {
                    resolve(
                        request.result || {}
                    );
                };

            request.onerror =
                function () {
                    resolve({});
                };
        });
    }


    async function saveDeltas(deltas) {

        const db =
            await openDB();

        return new Promise(function (resolve, reject) {

            const transaction =
                db.transaction(
                    "deltas",
                    "readwrite"
                );

            transaction
                .objectStore(
                    "deltas"
                )
                .put(
                    deltas,
                    DELTA_KEY
                );

            transaction.oncomplete =
                function () {
                    resolve();
                };

            transaction.onerror =
                function () {
                    reject(
                        transaction.error
                    );
                };
        });
    }


    /* =====================================
       Start Univer
       ===================================== */

    const {
        createUniver
    } = UniverPresets;

    const {
        LocaleType,
        mergeLocales
    } = UniverCore;

    const {
        UniverSheetsCorePreset
    } = UniverPresetSheetsCore;


    const {
        univerAPI
    } = createUniver({

        locale:
            LocaleType.EN_US,

        locales: {

            [LocaleType.EN_US]:

                mergeLocales(
                    UniverPresetSheetsCoreEnUS
                )
        },

        presets: [

            UniverSheetsCorePreset({
                container: "app"
            })

        ]
    });


    /* =====================================
       Convert Excel cell
       ===================================== */

    function makeCell(
        source,
        sheetName
    ) {

        if (!source) {
            return null;
        }

        const cell = {};


        /*
         * Excel Commands contains example
         * formulas for participants to read.
         * Keep them as TEXT rather than
         * asking Univer to calculate them.
         */

        if (
            sheetName === "Excel Commands" &&
            source.f
        ) {

            cell.v =
                "=" + source.f;

            return cell;
        }


        /*
         * Real formula
         */

        if (source.f) {

            cell.f =
                source.f.startsWith("=")
                    ? source.f
                    : "=" + source.f;
        }


        /*
         * Value
         */

        if (
            source.v !== undefined &&
            source.v !== null
        ) {

            cell.v =
                source.v;
        }


        /*
         * Number / percentage / date format
         */

        if (
            source.z &&
            source.z !== "General"
        ) {

            cell.s = {
                n: {
                    pattern:
                        source.z
                }
            };
        }


        return cell;
    }


    /* =====================================
       Convert Excel worksheet
       ===================================== */

    function convertSheet(
        worksheet,
        name,
        index
    ) {

        const cellData = {};
        const columnData = {};
        const rowData = {};
        const mergeData = [];

        let rows = 1000;
        let columns = 26;


        /*
         * Dense mode is faster for
         * very large worksheets.
         */

        if (worksheet["!data"]) {

            const data =
                worksheet["!data"];

            for (
                let r = 0;
                r < data.length;
                r++
            ) {

                const row =
                    data[r];

                if (!row) {
                    continue;
                }

                for (
                    let c = 0;
                    c < row.length;
                    c++
                ) {

                    const source =
                        row[c];

                    if (!source) {
                        continue;
                    }

                    const cell =
                        makeCell(
                            source,
                            name
                        );

                    if (!cell) {
                        continue;
                    }

                    if (!cellData[r]) {
                        cellData[r] = {};
                    }

                    cellData[r][c] =
                        cell;

                    rows =
                        Math.max(
                            rows,
                            r + 1
                        );

                    columns =
                        Math.max(
                            columns,
                            c + 1
                        );
                }
            }

        } else {

            /*
             * Fallback for sparse worksheets
             */

            Object.keys(
                worksheet
            ).forEach(function (address) {

                if (
                    address.charAt(0) === "!"
                ) {
                    return;
                }

                const source =
                    worksheet[address];

                const position =
                    XLSX.utils.decode_cell(
                        address
                    );

                const cell =
                    makeCell(
                        source,
                        name
                    );

                if (!cell) {
                    return;
                }

                if (
                    !cellData[position.r]
                ) {
                    cellData[position.r] = {};
                }

                cellData[position.r][position.c] =
                    cell;

                rows =
                    Math.max(
                        rows,
                        position.r + 1
                    );

                columns =
                    Math.max(
                        columns,
                        position.c + 1
                    );
            });
        }


        /*
         * Column widths
         */

        if (
            Array.isArray(
                worksheet["!cols"]
            )
        ) {

            worksheet["!cols"].forEach(
                function (column, i) {

                    if (!column) {
                        return;
                    }

                    let width =
                        column.wpx;

                    if (
                        !width &&
                        column.wch
                    ) {

                        width =
                            Math.round(
                                column.wch * 7 + 5
                            );
                    }

                    if (width) {

                        columnData[i] = {
                            w: width
                        };
                    }
                }
            );
        }


        /*
         * Row heights
         */

        if (
            Array.isArray(
                worksheet["!rows"]
            )
        ) {

            worksheet["!rows"].forEach(
                function (row, i) {

                    if (!row) {
                        return;
                    }

                    let height =
                        row.hpx;

                    if (
                        !height &&
                        row.hpt
                    ) {

                        height =
                            Math.round(
                                row.hpt *
                                96 / 72
                            );
                    }

                    if (height) {

                        rowData[i] = {
                            h: height
                        };
                    }
                }
            );
        }


        /*
         * Merged cells
         */

        if (
            Array.isArray(
                worksheet["!merges"]
            )
        ) {

            worksheet["!merges"].forEach(
                function (merge) {

                    mergeData.push({

                        startRow:
                            merge.s.r,

                        endRow:
                            merge.e.r,

                        startColumn:
                            merge.s.c,

                        endColumn:
                            merge.e.c

                    });
                }
            );
        }


        return {

            id:
                "sheet_" +
                index,

            name:
                name,

            rowCount:
                rows,

            columnCount:
                columns,

            defaultColumnWidth:
                88,

            defaultRowHeight:
                22,

            cellData:
                cellData,

            columnData:
                columnData,

            rowData:
                rowData,

            mergeData:
                mergeData,

            showGridlines:
                1,

            rowHeader: {
                width: 46
            },

            columnHeader: {
                height: 20
            }
        };
    }


    /* =====================================
       Load original XLSX
       ===================================== */

    async function loadTemplate() {

        const response =
            await fetch(
                FILE,
                {
                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Cannot load " +
                FILE
            );
        }


        const buffer =
            await response.arrayBuffer();


        /*
         * dense:true is important for
         * the large HILDA data worksheet.
         */

        const excel =
            XLSX.read(
                buffer,
                {
                    dense:
                        true,

                    cellFormula:
                        true,

                    cellStyles:
                        true,

                    cellNF:
                        true
                }
            );


        const sheets = {};
        const sheetOrder = [];


        excel.SheetNames.forEach(
            function (
                name,
                index
            ) {

                const converted =
                    convertSheet(
                        excel.Sheets[name],
                        name,
                        index
                    );

                sheets[
                    converted.id
                ] =
                    converted;

                sheetOrder.push(
                    converted.id
                );
            }
        );


        return {

            id:
                "HILDA_" +
                pid,

            name:
                "HILDA Spreadsheet",

            locale:
                LocaleType.EN_US,

            styles:
                {},

            sheetOrder:
                sheetOrder,

            sheets:
                sheets
        };
    }


    /* =====================================
       Clone small cell objects safely
       ===================================== */

    function cloneCell(cell) {

        if (
            cell === null ||
            cell === undefined
        ) {
            return null;
        }

        if (
            typeof structuredClone ===
            "function"
        ) {
            return structuredClone(cell);
        }

        return JSON.parse(
            JSON.stringify(cell)
        );
    }


    /* =====================================
       Load workbook + participant deltas
       ===================================== */

    try {

        /*
         * Always start from original Excel.
         */

        const snapshot =
            await loadTemplate();


        const workbook =
            univerAPI.createWorkbook(
                snapshot
            );


        /*
         * Load ONLY this participant's
         * changed cells.
         */

        let deltas =
            await loadDeltas();


        /*
         * Restore previous participant edits.
         */

        Object.keys(
            deltas
        ).forEach(
            function (sheetName) {

                const worksheet =
                    workbook.getSheetByName(
                        sheetName
                    );

                if (!worksheet) {
                    return;
                }

                const sheetDeltas =
                    deltas[sheetName];

                Object.keys(
                    sheetDeltas
                ).forEach(
                    function (position) {

                        const parts =
                            position.split(",");

                        const row =
                            Number(parts[0]);

                        const column =
                            Number(parts[1]);

                        const cell =
                            sheetDeltas[position];


                        const range =
                            worksheet.getRange(
                                row,
                                column
                            );


                        /*
                         * null means participant
                         * cleared this cell.
                         */

                        if (
                            cell === null
                        ) {

                            range.setValue(
                                null
                            );

                        } else {

                            /*
                             * ICellData can include:
                             * v = value
                             * f = formula
                             * s = number format/style
                             */

                            range.setValue(
                                cell
                            );
                        }
                    }
                );
            }
        );


        document
            .getElementById(
                "status"
            )
            .style.display =
                "none";


        /* =================================
           DELTA AUTOSAVE
           =================================
           No workbook.save() anywhere.
           ================================= */

        let saveTimer =
            null;


        function scheduleDeltaSave() {

            clearTimeout(
                saveTimer
            );

            saveTimer =
                setTimeout(
                    function () {

                        saveDeltas(
                            deltas
                        ).catch(
                            console.error
                        );

                    },
                    250
                );
        }


        /*
         * Listen for changes separately
         * on every worksheet.
         *
         * onCellDataChange returns ONLY
         * cells that actually changed.
         */

        workbook
            .getSheets()
            .forEach(
                function (worksheet) {

                    const sheetName =
                        worksheet.getSheetName();


                    worksheet.onCellDataChange(
                        function (
                            changedCells
                        ) {

                            if (
                                !deltas[
                                    sheetName
                                ]
                            ) {

                                deltas[
                                    sheetName
                                ] = {};
                            }


                            const matrix =
                                changedCells
                                    .getMatrix();


                            Object.keys(
                                matrix
                            ).forEach(
                                function (
                                    rowKey
                                ) {

                                    const row =
                                        matrix[
                                            rowKey
                                        ];

                                    if (!row) {
                                        return;
                                    }


                                    Object.keys(
                                        row
                                    ).forEach(
                                        function (
                                            columnKey
                                        ) {

                                            const cell =
                                                row[
                                                    columnKey
                                                ];


                                            const key =
                                                rowKey +
                                                "," +
                                                columnKey;


                                            deltas[
                                                sheetName
                                            ][key] =
                                                cloneCell(
                                                    cell
                                                );
                                        }
                                    );
                                }
                            );


                            scheduleDeltaSave();
                        }
                    );
                }
            );


        /*
         * Final lightweight save when
         * leaving / switching Qualtrics page.
         */

        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "hidden"
                ) {

                    clearTimeout(
                        saveTimer
                    );

                    saveDeltas(
                        deltas
                    ).catch(
                        console.error
                    );
                }
            }
        );


        window.addEventListener(
            "pagehide",
            function () {

                clearTimeout(
                    saveTimer
                );

                saveDeltas(
                    deltas
                ).catch(
                    console.error
                );
            }
        );


    } catch (error) {

        console.error(
            error
        );

        document
            .getElementById(
                "status"
            )
            .textContent =

                "Spreadsheet could not be loaded: " +
                error.message;
    }

})();
</script>

</body>
</html>
