<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>HILDA Spreadsheet</title>

  <!-- Required libraries -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
  <script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

  <!-- Univer -->
  <script src="https://unpkg.com/@univerjs/presets@0.25.0/lib/umd/index.js"></script>

  <script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/index.js"></script>

  <script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/locales/en-US.js"></script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/index.css"
  />

  <style>
    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: white;
    }

    #error {
      display: none;
      font-family: Arial, sans-serif;
      padding: 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="app"></div>
<div id="error"></div>

<script>
(function () {

    /*
     * --------------------------------------
     * 1. Read participant ID + sheet ID
     * --------------------------------------
     */

    const params = new URLSearchParams(window.location.search);

    const participantID = params.get("pid");
    const sheetID = params.get("sheet");


    /*
     * Stop if participant ID or sheet ID
     * was not supplied by Qualtrics.
     */

    if (!participantID || !sheetID) {

        document.getElementById("app").style.display = "none";

        const error = document.getElementById("error");

        error.style.display = "block";

        if (!participantID && !sheetID) {
            error.textContent =
                "Missing participant ID and sheet ID.";
        } else if (!participantID) {
            error.textContent =
                "Missing participant ID.";
        } else {
            error.textContent =
                "Missing sheet ID.";
        }

        return;
    }


    /*
     * --------------------------------------
     * 2. Independent storage
     * --------------------------------------
     *
     * Example:
     *
     * Participant ABC + task1
     * HILDA_UNIVER_SHEET_ABC_task1
     *
     * Participant ABC + task2
     * HILDA_UNIVER_SHEET_ABC_task2
     *
     * Participant XYZ + task1
     * HILDA_UNIVER_SHEET_XYZ_task1
     *
     */

    const STORAGE_KEY =
        "HILDA_UNIVER_SHEET_" +
        participantID +
        "_" +
        sheetID;


    /*
     * --------------------------------------
     * 3. Start Univer
     * --------------------------------------
     */

    const { createUniver } = UniverPresets;

    const {
        LocaleType,
        mergeLocales
    } = UniverCore;

    const {
        UniverSheetsCorePreset
    } = UniverPresetSheetsCore;


    const { univerAPI } = createUniver({

        locale: LocaleType.EN_US,

        locales: {
            [LocaleType.EN_US]:
                mergeLocales(
                    UniverPresetSheetsCoreEnUS
                )
        },

        presets: [
            UniverSheetsCorePreset({
                container: "app"
            })
        ]

    });


    /*
     * --------------------------------------
     * 4. Load this participant's
     *    spreadsheet for this page
     * --------------------------------------
     */

    let savedWorkbook = null;

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (saved) {
            savedWorkbook = JSON.parse(saved);
        }

    } catch (e) {

        console.error(
            "Could not load saved spreadsheet:",
            e
        );

    }


    /*
     * --------------------------------------
     * 5. Create workbook
     * --------------------------------------
     */

    let workbook;

    if (savedWorkbook) {

        workbook =
            univerAPI.createWorkbook(
                savedWorkbook
            );

    } else {

        workbook =
            univerAPI.createWorkbook({
                name: "Participant Spreadsheet"
            });

    }


    /*
     * --------------------------------------
     * 6. Autosave
     * --------------------------------------
     */

    let saveTimer = null;

    function saveSpreadsheet() {

        clearTimeout(saveTimer);

        saveTimer = setTimeout(function () {

            try {

                const snapshot =
                    workbook.save();

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(snapshot)
                );

            } catch (e) {

                console.error(
                    "Could not save spreadsheet:",
                    e
                );

            }

        }, 300);

    }


    /*
     * Save whenever Univer executes
     * an editing/formatting command.
     */

    univerAPI.onCommandExecuted(function () {

        saveSpreadsheet();

    });


    /*
     * Save one final time when page closes
     * or Qualtrics moves to next page.
     */

    window.addEventListener(
        "beforeunload",
        function () {

            try {

                const snapshot =
                    workbook.save();

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(snapshot)
                );

            } catch (e) {

                console.error(
                    "Final spreadsheet save failed:",
                    e
                );

            }

        }
    );

})();
</script>

</body>
</html>
