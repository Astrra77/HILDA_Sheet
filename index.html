<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>HILDA Spreadsheet</title>

  <!-- Required libraries -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
  <script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

  <!-- Univer -->
  <script src="https://unpkg.com/@univerjs/presets@0.25.0/lib/umd/index.js"></script>

  <script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/index.js"></script>

  <script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/locales/en-US.js"></script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/index.css"
  />

  <style>
    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: white;
    }

    #error {
      display: none;
      font-family: Arial, sans-serif;
      padding: 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="app"></div>
<div id="error"></div>

<script>
(function () {

  /* ---------------------------------------
     Participant ID
  --------------------------------------- */

  const params = new URLSearchParams(window.location.search);
  const participantID = params.get("pid");

  if (!participantID) {
    document.getElementById("app").style.display = "none";

    const error = document.getElementById("error");
    error.style.display = "block";
    error.textContent = "Missing participant ID.";

    return;
  }


  /* ---------------------------------------
     Separate storage for each participant
  --------------------------------------- */

  const STORAGE_KEY =
    "HILDA_UNIVER_SHEET_" + participantID;


  /* ---------------------------------------
     Start Univer
  --------------------------------------- */

  const { createUniver } = UniverPresets;

  const {
    LocaleType,
    mergeLocales
  } = UniverCore;

  const {
    UniverSheetsCorePreset
  } = UniverPresetSheetsCore;


  const { univerAPI } = createUniver({

    locale: LocaleType.EN_US,

    locales: {
      [LocaleType.EN_US]:
        mergeLocales(
          UniverPresetSheetsCoreEnUS
        )
    },

    presets: [
      UniverSheetsCorePreset({
        container: "app"
      })
    ]

  });


  /* ---------------------------------------
     Load participant's previous spreadsheet
     or create a completely blank one
  --------------------------------------- */

  let savedWorkbook = null;

  try {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (saved) {
      savedWorkbook = JSON.parse(saved);
    }

  } catch (e) {
    console.error(
      "Could not load saved spreadsheet:",
      e
    );
  }


  let workbook;

  if (savedWorkbook) {

    workbook =
      univerAPI.createWorkbook(
        savedWorkbook
      );

  } else {

    workbook =
      univerAPI.createWorkbook({
        name: "Participant Spreadsheet"
      });

  }


  /* ---------------------------------------
     Autosave
  --------------------------------------- */

  let saveTimer = null;

  function saveSpreadsheet() {

    clearTimeout(saveTimer);

    saveTimer = setTimeout(function () {

      try {

        const snapshot =
          workbook.save();

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(snapshot)
        );

      } catch (e) {

        console.error(
          "Could not save spreadsheet:",
          e
        );

      }

    }, 300);

  }


  /*
    Save after spreadsheet commands.

    This catches cell edits, formulas,
    formatting, percentage formatting,
    row/column operations, etc.
  */

  workbook.onCommandExecuted(function () {
    saveSpreadsheet();
  });


  /* Save once more before leaving */

  window.addEventListener(
    "beforeunload",
    function () {

      try {

        const snapshot =
          workbook.save();

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(snapshot)
        );

      } catch (e) {}

    }
  );

})();
</script>

</body>
</html>
