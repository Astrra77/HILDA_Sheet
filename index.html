<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HILDA Spreadsheet</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
<script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

<script src="https://unpkg.com/@univerjs/presets@0.25.0/lib/umd/index.js"></script>

<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/locales/en-US.js"></script>

<script src="https://unpkg.com/@univerjs/preset-sheets-filter@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-filter@0.25.0/lib/umd/locales/en-US.js"></script>

<link rel="stylesheet"
href="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/index.css">

<link rel="stylesheet"
href="https://unpkg.com/@univerjs/preset-sheets-filter@0.25.0/lib/index.css">

<style>

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: white;
}

#tools {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border-bottom: 1px solid #ddd;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

#tools button {
    padding: 6px 14px;
    border: 1px solid #bbb;
    border-radius: 4px;
    background: white;
    cursor: pointer;
    font-size: 13px;
}

#tools button:hover {
    background: #eee;
}

#tools button:disabled {
    opacity: 0.6;
    cursor: default;
}

#app {
    width: 100%;
    height: calc(100% - 40px);
    overflow: hidden;
}

#status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    z-index: 9999;
}

</style>
</head>

<body>

<div id="tools">
    <button id="filterBtn">Filter</button>
    <button id="duplicateBtn">Remove Duplicates</button>
</div>

<div id="app"></div>
<div id="status">Loading spreadsheet...</div>

<script>

(async function () {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const pid =
        params.get("pid");

    if (!pid) {
        document.getElementById("status").textContent =
            "Missing participant ID.";
        return;
    }


    const VERSION =
        "delta_v1";

    const DELTA_KEY =
        "HILDA_" +
        VERSION +
        "_" +
        pid;

    const FILE =
        "./HILDA_COVID_structured_v3.xlsx";


    /* =========================
       IndexedDB
       ========================= */

    function openDB() {

        return new Promise(function (resolve, reject) {

            const request =
                indexedDB.open(
                    "HILDA_DELTA_DB",
                    1
                );

            request.onupgradeneeded =
                function (event) {

                    const db =
                        event.target.result;

                    if (
                        !db.objectStoreNames.contains(
                            "deltas"
                        )
                    ) {
                        db.createObjectStore(
                            "deltas"
                        );
                    }
                };

            request.onsuccess =
                function () {
                    resolve(request.result);
                };

            request.onerror =
                function () {
                    reject(request.error);
                };

        });
    }


    async function loadDeltas() {

        const db =
            await openDB();

        return new Promise(function (resolve) {

            const request =
                db
                    .transaction(
                        "deltas",
                        "readonly"
                    )
                    .objectStore(
                        "deltas"
                    )
                    .get(
                        DELTA_KEY
                    );

            request.onsuccess =
                function () {
                    resolve(
                        request.result || {}
                    );
                };

            request.onerror =
                function () {
                    resolve({});
                };

        });
    }


    async function saveDeltas(deltas) {

        const db =
            await openDB();

        return new Promise(function (resolve, reject) {

            const tx =
                db.transaction(
                    "deltas",
                    "readwrite"
                );

            tx
                .objectStore(
                    "deltas"
                )
                .put(
                    deltas,
                    DELTA_KEY
                );

            tx.oncomplete =
                resolve;

            tx.onerror =
                function () {
                    reject(
                        tx.error
                    );
                };

        });
    }


    /* =========================
       Univer
       ========================= */

    const {
        createUniver
    } = UniverPresets;

    const {
        LocaleType,
        mergeLocales
    } = UniverCore;

    const {
        UniverSheetsCorePreset
    } = UniverPresetSheetsCore;


    const FilterPreset =
        typeof window.UniverSheetsFilterPreset === "function"
            ? window.UniverSheetsFilterPreset
            : window.UniverSheetsFilterPreset
                .UniverSheetsFilterPreset;


    const {
        univerAPI
    } = createUniver({

        locale:
            LocaleType.EN_US,

        locales: {

            [LocaleType.EN_US]:

                mergeLocales(
                    UniverPresetSheetsCoreEnUS,
                    UniverPresetSheetsFilterEnUS
                )
        },

        presets: [

            UniverSheetsCorePreset({
                container: "app"
            }),

            FilterPreset()

        ]

    });


    /* =========================
       Excel import
       ========================= */

    function makeCell(
        source,
        sheetName
    ) {

        if (!source) {
            return null;
        }

        const cell = {};


        if (
            sheetName === "Excel Commands" &&
            source.f
        ) {

            cell.v =
                "=" + source.f;

            return cell;
        }


        if (source.f) {

            cell.f =
                source.f.startsWith("=")
                    ? source.f
                    : "=" + source.f;
        }


        if (
            source.v !== undefined &&
            source.v !== null
        ) {

            cell.v =
                source.v;
        }


        if (
            source.z &&
            source.z !== "General"
        ) {

            cell.s = {
                n: {
                    pattern:
                        source.z
                }
            };
        }


        return cell;
    }


    function convertSheet(
        worksheet,
        name,
        index
    ) {

        const cellData = {};
        const columnData = {};
        const rowData = {};
        const mergeData = [];

        let rows = 1000;
        let columns = 26;


        if (worksheet["!data"]) {

            const data =
                worksheet["!data"];

            for (
                let r = 0;
                r < data.length;
                r++
            ) {

                const row =
                    data[r];

                if (!row) {
                    continue;
                }

                for (
                    let c = 0;
                    c < row.length;
                    c++
                ) {

                    const source =
                        row[c];

                    if (!source) {
                        continue;
                    }

                    const cell =
                        makeCell(
                            source,
                            name
                        );

                    if (!cell) {
                        continue;
                    }

                    if (!cellData[r]) {
                        cellData[r] = {};
                    }

                    cellData[r][c] =
                        cell;

                    rows =
                        Math.max(
                            rows,
                            r + 1
                        );

                    columns =
                        Math.max(
                            columns,
                            c + 1
                        );
                }
            }

        } else {

            Object.keys(
                worksheet
            ).forEach(function (address) {

                if (
                    address.charAt(0) === "!"
                ) {
                    return;
                }

                const source =
                    worksheet[address];

                const position =
                    XLSX.utils.decode_cell(
                        address
                    );

                const cell =
                    makeCell(
                        source,
                        name
                    );

                if (!cell) {
                    return;
                }

                if (!cellData[position.r]) {
                    cellData[position.r] = {};
                }

                cellData[
                    position.r
                ][
                    position.c
                ] = cell;

                rows =
                    Math.max(
                        rows,
                        position.r + 1
                    );

                columns =
                    Math.max(
                        columns,
                        position.c + 1
                    );

            });

        }


        if (
            Array.isArray(
                worksheet["!cols"]
            )
        ) {

            worksheet["!cols"]
                .forEach(function (column, i) {

                    if (!column) {
                        return;
                    }

                    let width =
                        column.wpx;

                    if (
                        !width &&
                        column.wch
                    ) {

                        width =
                            Math.round(
                                column.wch * 7 + 5
                            );
                    }

                    if (width) {

                        columnData[i] = {
                            w: width
                        };
                    }

                });
        }


        if (
            Array.isArray(
                worksheet["!rows"]
            )
        ) {

            worksheet["!rows"]
                .forEach(function (row, i) {

                    if (!row) {
                        return;
                    }

                    let height =
                        row.hpx;

                    if (
                        !height &&
                        row.hpt
                    ) {

                        height =
                            Math.round(
                                row.hpt *
                                96 / 72
                            );
                    }

                    if (height) {

                        rowData[i] = {
                            h: height
                        };
                    }

                });
        }


        if (
            Array.isArray(
                worksheet["!merges"]
            )
        ) {

            worksheet["!merges"]
                .forEach(function (merge) {

                    mergeData.push({

                        startRow:
                            merge.s.r,

                        endRow:
                            merge.e.r,

                        startColumn:
                            merge.s.c,

                        endColumn:
                            merge.e.c

                    });

                });
        }


        return {

            id:
                "sheet_" +
                index,

            name:
                name,

            rowCount:
                rows,

            columnCount:
                columns,

            defaultColumnWidth:
                88,

            defaultRowHeight:
                22,

            cellData:
                cellData,

            columnData:
                columnData,

            rowData:
                rowData,

            mergeData:
                mergeData,

            showGridlines:
                1,

            rowHeader: {
                width: 46
            },

            columnHeader: {
                height: 20
            }

        };
    }


    async function loadTemplate() {

        const response =
            await fetch(
                FILE,
                {
                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Cannot load " +
                FILE
            );
        }


        const buffer =
            await response.arrayBuffer();


        const excel =
            XLSX.read(
                buffer,
                {
                    dense:
                        true,

                    cellFormula:
                        true,

                    cellStyles:
                        true,

                    cellNF:
                        true
                }
            );


        const sheets = {};
        const sheetOrder = [];


        excel.SheetNames
            .forEach(function (
                name,
                index
            ) {

                const converted =
                    convertSheet(
                        excel.Sheets[name],
                        name,
                        index
                    );

                sheets[
                    converted.id
                ] = converted;

                sheetOrder.push(
                    converted.id
                );

            });


        return {

            id:
                "HILDA_" +
                pid,

            name:
                "HILDA Spreadsheet",

            locale:
                LocaleType.EN_US,

            styles:
                {},

            sheetOrder:
                sheetOrder,

            sheets:
                sheets

        };
    }


    function cloneCell(cell) {

        if (
            cell === null ||
            cell === undefined
        ) {
            return null;
        }

        if (
            typeof structuredClone ===
            "function"
        ) {

            return structuredClone(
                cell
            );
        }

        return JSON.parse(
            JSON.stringify(
                cell
            )
        );
    }


    function sameValue(a, b) {

        return (
            a === b ||
            (
                Number.isNaN(a) &&
                Number.isNaN(b)
            )
        );
    }


    function duplicateKey(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "blank:";
        }

        if (
            typeof value === "string"
        ) {

            return "string:" +
                value.toLowerCase();
        }

        return (
            typeof value +
            ":" +
            String(value)
        );
    }


    /* =========================
       Workbook
       ========================= */

    try {

        const snapshot =
            await loadTemplate();


        const workbook =
            univerAPI.createWorkbook(
                snapshot
            );


        let deltas =
            await loadDeltas();


        Object.keys(
            deltas
        ).forEach(function (
            sheetName
        ) {

            const worksheet =
                workbook.getSheetByName(
                    sheetName
                );

            if (!worksheet) {
                return;
            }


            Object.keys(
                deltas[sheetName]
            ).forEach(function (
                position
            ) {

                const parts =
                    position.split(",");

                const row =
                    Number(parts[0]);

                const column =
                    Number(parts[1]);

                const cell =
                    deltas[
                        sheetName
                    ][
                        position
                    ];


                if (cell === null) {

                    worksheet
                        .getRange(
                            row,
                            column
                        )
                        .setValue(
                            null
                        );

                } else {

                    worksheet
                        .getRange(
                            row,
                            column
                        )
                        .setValue(
                            cell
                        );
                }

            });

        });


        document
            .getElementById(
                "status"
            )
            .style.display =
                "none";


        /* =========================
           Delta save
           ========================= */

        let saveTimer =
            null;

        let bulkEditing =
            false;


        function scheduleSave() {

            clearTimeout(
                saveTimer
            );

            saveTimer =
                setTimeout(
                    function () {

                        saveDeltas(
                            deltas
                        ).catch(
                            console.error
                        );

                    },
                    250
                );
        }


        workbook
            .getSheets()
            .forEach(function (
                worksheet
            ) {

                const sheetName =
                    worksheet.getSheetName();


                worksheet.onCellDataChange(
                    function (
                        changedCells
                    ) {

                        if (bulkEditing) {
                            return;
                        }


                        if (
                            !deltas[
                                sheetName
                            ]
                        ) {

                            deltas[
                                sheetName
                            ] = {};
                        }


                        const matrix =
                            changedCells.getMatrix();


                        Object.keys(
                            matrix
                        ).forEach(function (r) {

                            if (!matrix[r]) {
                                return;
                            }


                            Object.keys(
                                matrix[r]
                            ).forEach(function (c) {

                                deltas[
                                    sheetName
                                ][
                                    r + "," + c
                                ] =
                                    cloneCell(
                                        matrix[r][c]
                                    );

                            });

                        });


                        scheduleSave();

                    }
                );

            });


        function getSelectedColumn(
            sheet
        ) {

            const range =
                sheet.getActiveRange();

            if (!range) {
                return null;
            }


            const info =
                range.getRange();


            if (
                info.startColumn !==
                info.endColumn
            ) {

                return null;
            }


            return info.startColumn;
        }


        /* =========================
           FILTER
           ========================= */

        const filterBtn =
            document.getElementById(
                "filterBtn"
            );


        filterBtn.onmousedown =
            function (event) {
                event.preventDefault();
            };


        filterBtn.onclick =
            function () {

                try {

                    const sheet =
                        univerAPI
                            .getActiveWorkbook()
                            .getActiveSheet();


                    const column =
                        getSelectedColumn(
                            sheet
                        );


                    if (
                        column === null
                    ) {

                        alert(
                            "Select one column first."
                        );

                        return;
                    }


                    const dataRange =
                        sheet.getDataRange();

                    const dataInfo =
                        dataRange.getRange();


                    const columnValues =
                        sheet
                            .getRange(
                                0,
                                column,
                                dataInfo.endRow + 1,
                                1
                            )
                            .getRawValues();


                    let lastRow =
                        columnValues.length - 1;


                    while (
                        lastRow > 0 &&
                        (
                            columnValues[
                                lastRow
                            ][0] === null ||
                            columnValues[
                                lastRow
                            ][0] === undefined ||
                            columnValues[
                                lastRow
                            ][0] === ""
                        )
                    ) {

                        lastRow--;
                    }


                    if (
                        lastRow < 1
                    ) {

                        alert(
                            "This column has no data."
                        );

                        return;
                    }


                    /*
                     * Univer allows one filter
                     * per worksheet.
                     */

                    const existing =
                        sheet.getFilter();


                    if (existing) {

                        existing.remove();
                    }


                    /*
                     * Header = row 1.
                     * Filter only selected column.
                     */

                    const filterRange =
                        sheet.getRange(
                            0,
                            column,
                            lastRow + 1,
                            1
                        );


                    const filter =
                        filterRange.createFilter();


                    if (!filter) {

                        alert(
                            "Filter could not be created."
                        );

                        return;
                    }


                    /*
                     * Header now gets the native
                     * Univer filter dropdown.
                     */

                } catch (error) {

                    console.error(error);

                    alert(
                        "Filter could not be applied."
                    );
                }
            };


        /* =========================
           REMOVE DUPLICATES
           Selected column only
           ========================= */

        const duplicateBtn =
            document.getElementById(
                "duplicateBtn"
            );


        duplicateBtn.onmousedown =
            function (event) {
                event.preventDefault();
            };


        duplicateBtn.onclick =
            async function () {

                try {

                    const sheet =
                        univerAPI
                            .getActiveWorkbook()
                            .getActiveSheet();


                    const column =
                        getSelectedColumn(
                            sheet
                        );


                    if (
                        column === null
                    ) {

                        alert(
                            "Select one column first."
                        );

                        return;
                    }


                    duplicateBtn.disabled =
                        true;

                    duplicateBtn.textContent =
                        "Working...";


                    await new Promise(
                        requestAnimationFrame
                    );


                    const dataInfo =
                        sheet
                            .getDataRange()
                            .getRange();


                    const values =
                        sheet
                            .getRange(
                                0,
                                column,
                                dataInfo.endRow + 1,
                                1
                            )
                            .getRawValues();


                    /*
                     * Trim empty cells at bottom.
                     */

                    let lastRow =
                        values.length - 1;


                    while (
                        lastRow > 0 &&
                        (
                            values[
                                lastRow
                            ][0] === null ||
                            values[
                                lastRow
                            ][0] === undefined ||
                            values[
                                lastRow
                            ][0] === ""
                        )
                    ) {

                        lastRow--;
                    }


                    if (
                        lastRow < 2
                    ) {

                        alert(
                            "Not enough data to remove duplicates."
                        );

                        return;
                    }


                    /*
                     * Row 1 is header.
                     */

                    const seen =
                        new Set();

                    const unique =
                        [];


                    for (
                        let r = 1;
                        r <= lastRow;
                        r++
                    ) {

                        const value =
                            values[r][0];

                        const key =
                            duplicateKey(
                                value
                            );


                        if (
                            !seen.has(key)
                        ) {

                            seen.add(key);

                            unique.push([
                                value
                            ]);
                        }


                        if (
                            r % 5000 === 0
                        ) {

                            await new Promise(
                                requestAnimationFrame
                            );
                        }
                    }


                    const removed =
                        lastRow -
                        unique.length;


                    if (
                        removed === 0
                    ) {

                        alert(
                            "No duplicate values found."
                        );

                        return;
                    }


                    const oldValues =
                        values
                            .slice(
                                1,
                                lastRow + 1
                            )
                            .map(
                                function (row) {
                                    return row[0];
                                }
                            );


                    /*
                     * Remove duplicate values only
                     * from selected column.
                     */

                    bulkEditing =
                        true;


                    sheet
                        .getRange(
                            1,
                            column,
                            lastRow,
                            1
                        )
                        .clearContent();


                    sheet
                        .getRange(
                            1,
                            column,
                            unique.length,
                            1
                        )
                        .setValues(
                            unique
                        );


                    bulkEditing =
                        false;


                    /*
                     * Save only changed cells.
                     */

                    const sheetName =
                        sheet.getSheetName();


                    if (
                        !deltas[
                            sheetName
                        ]
                    ) {

                        deltas[
                            sheetName
                        ] = {};
                    }


                    for (
                        let i = 0;
                        i < lastRow;
                        i++
                    ) {

                        const newValue =
                            i < unique.length
                                ? unique[i][0]
                                : null;


                        if (
                            !sameValue(
                                oldValues[i],
                                newValue
                            )
                        ) {

                            const key =
                                (i + 1) +
                                "," +
                                column;


                            deltas[
                                sheetName
                            ][
                                key
                            ] =
                                newValue === null ||
                                newValue === undefined
                                    ? null
                                    : {
                                        v:
                                            newValue
                                    };
                        }
                    }


                    await saveDeltas(
                        deltas
                    );


                    alert(
                        removed +
                        " duplicate value" +
                        (
                            removed === 1
                                ? ""
                                : "s"
                        ) +
                        " removed."
                    );


                } catch (error) {

                    bulkEditing =
                        false;

                    console.error(error);

                    alert(
                        "Remove Duplicates failed."
                    );

                } finally {

                    duplicateBtn.disabled =
                        false;

                    duplicateBtn.textContent =
                        "Remove Duplicates";
                }
            };


        /* =========================
           Final lightweight save
           ========================= */

        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "hidden"
                ) {

                    clearTimeout(
                        saveTimer
                    );

                    saveDeltas(
                        deltas
                    ).catch(
                        console.error
                    );
                }
            }
        );


        window.addEventListener(
            "pagehide",
            function () {

                clearTimeout(
                    saveTimer
                );

                saveDeltas(
                    deltas
                ).catch(
                    console.error
                );
            }
        );


    } catch (error) {

        console.error(error);

        document
            .getElementById(
                "status"
            )
            .textContent =

                "Spreadsheet could not be loaded: " +
                error.message;
    }

})();

</script>

</body>
</html>
