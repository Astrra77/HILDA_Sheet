<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HILDA Spreadsheet</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
<script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

<script src="https://unpkg.com/@univerjs/presets@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/locales/en-US.js"></script>

<link
    rel="stylesheet"
    href="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/index.css"
>

<style>
html,
body,
#app {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: white;
}

#status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    z-index: 9999;
}
</style>
</head>

<body>

<div id="app"></div>
<div id="status">Loading spreadsheet...</div>

<script>
(async function () {

    const params =
        new URLSearchParams(window.location.search);

    const pid =
        params.get("pid");

    if (!pid) {
        document.getElementById("status").textContent =
            "Missing participant ID.";
        return;
    }


    /*
     * Same workbook across all seven Qualtrics pages.
     * Different participants still get separate saved copies.
     */

    const VERSION = "v2";

    const KEY =
        "HILDA_" +
        VERSION +
        "_" +
        pid;

    const FILE =
        "./HILDA_COVID_structured_v3.xlsx";


    /* =====================================
       IndexedDB
       ===================================== */

    function openDB() {

        return new Promise(function (resolve, reject) {

            const request =
                indexedDB.open(
                    "HILDA_DB",
                    1
                );

            request.onupgradeneeded =
                function (event) {

                    const db =
                        event.target.result;

                    if (
                        !db.objectStoreNames.contains(
                            "workbooks"
                        )
                    ) {
                        db.createObjectStore(
                            "workbooks"
                        );
                    }
                };

            request.onsuccess =
                function () {
                    resolve(
                        request.result
                    );
                };

            request.onerror =
                function () {
                    reject(
                        request.error
                    );
                };
        });
    }


    async function getSaved() {

        const db =
            await openDB();

        return new Promise(function (resolve) {

            const request =
                db
                .transaction(
                    "workbooks",
                    "readonly"
                )
                .objectStore(
                    "workbooks"
                )
                .get(KEY);

            request.onsuccess =
                function () {

                    resolve(
                        request.result ||
                        null
                    );
                };

            request.onerror =
                function () {
                    resolve(null);
                };
        });
    }


    async function saveWorkbook(snapshot) {

        const db =
            await openDB();

        const transaction =
            db.transaction(
                "workbooks",
                "readwrite"
            );

        transaction
            .objectStore(
                "workbooks"
            )
            .put(
                snapshot,
                KEY
            );
    }


    /* =====================================
       Start Univer
       ===================================== */

    const {
        createUniver
    } = UniverPresets;

    const {
        LocaleType,
        mergeLocales
    } = UniverCore;

    const {
        UniverSheetsCorePreset
    } = UniverPresetSheetsCore;


    const {
        univerAPI
    } = createUniver({

        locale:
            LocaleType.EN_US,

        locales: {

            [LocaleType.EN_US]:

                mergeLocales(
                    UniverPresetSheetsCoreEnUS
                )
        },

        presets: [

            UniverSheetsCorePreset({
                container: "app"
            })

        ]
    });


    /* =====================================
       Excel worksheet -> Univer worksheet
       ===================================== */

    function convertSheet(
        worksheet,
        name,
        index
    ) {

        const cellData = {};
        const columnData = {};
        const rowData = {};
        const mergeData = [];

        let rows = 1000;
        let columns = 26;


        /*
         * Cells
         */

        Object.keys(
            worksheet
        ).forEach(function (address) {

            if (
                address.charAt(0) === "!"
            ) {
                return;
            }

            const source =
                worksheet[address];

            const position =
                XLSX.utils.decode_cell(
                    address
                );

            rows =
                Math.max(
                    rows,
                    position.r + 1
                );

            columns =
                Math.max(
                    columns,
                    position.c + 1
                );

            if (
                !cellData[position.r]
            ) {
                cellData[position.r] = {};
            }

            const cell = {};


            /*
             * Preserve formula
             */

            if (source.f) {

                cell.f =
                    source.f.startsWith("=")
                        ? source.f
                        : "=" + source.f;
            }


            /*
             * Preserve value
             */

            if (
                source.v !== undefined
            ) {
                cell.v =
                    source.v;
            }


            /*
             * Preserve number /
             * percentage / date formats
             */

            if (
                source.z &&
                source.z !== "General"
            ) {

                cell.s = {
                    n: {
                        pattern:
                            source.z
                    }
                };
            }


            cellData[position.r][position.c] =
                cell;
        });


        /*
         * Excel column widths
         */

        if (
            Array.isArray(
                worksheet["!cols"]
            )
        ) {

            worksheet["!cols"].forEach(
                function (column, i) {

                    if (!column) {
                        return;
                    }

                    let width =
                        column.wpx;

                    if (
                        !width &&
                        column.wch
                    ) {

                        width =
                            Math.round(
                                column.wch * 7 + 5
                            );
                    }

                    if (width) {

                        columnData[i] = {
                            w: width
                        };
                    }

                }
            );
        }


        /*
         * Excel row heights
         */

        if (
            Array.isArray(
                worksheet["!rows"]
            )
        ) {

            worksheet["!rows"].forEach(
                function (row, i) {

                    if (!row) {
                        return;
                    }

                    let height =
                        row.hpx;

                    if (
                        !height &&
                        row.hpt
                    ) {

                        height =
                            Math.round(
                                row.hpt *
                                96 / 72
                            );
                    }

                    if (height) {

                        rowData[i] = {
                            h: height
                        };
                    }

                }
            );
        }


        /*
         * Excel merged cells
         */

        if (
            Array.isArray(
                worksheet["!merges"]
            )
        ) {

            worksheet["!merges"].forEach(
                function (merge) {

                    mergeData.push({

                        startRow:
                            merge.s.r,

                        endRow:
                            merge.e.r,

                        startColumn:
                            merge.s.c,

                        endColumn:
                            merge.e.c

                    });

                }
            );
        }


        return {

            id:
                "sheet_" +
                index,

            name:
                name,

            rowCount:
                rows,

            columnCount:
                columns,

            defaultColumnWidth:
                88,

            defaultRowHeight:
                22,

            cellData:
                cellData,

            columnData:
                columnData,

            rowData:
                rowData,

            mergeData:
                mergeData,

            showGridlines:
                1,

            rowHeader: {
                width: 46
            },

            columnHeader: {
                height: 20
            }

        };
    }


    /* =====================================
       Load XLSX
       ===================================== */

    async function loadTemplate() {

        const response =
            await fetch(
                FILE,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Cannot load " +
                FILE
            );
        }


        const buffer =
            await response.arrayBuffer();


        const excel =
            XLSX.read(
                buffer,
                {
                    cellFormula: true,
                    cellStyles: true,
                    cellNF: true
                }
            );


        const sheets = {};
        const sheetOrder = [];


        excel.SheetNames.forEach(
            function (
                name,
                index
            ) {

                const converted =
                    convertSheet(
                        excel.Sheets[name],
                        name,
                        index
                    );

                sheets[
                    converted.id
                ] =
                    converted;

                sheetOrder.push(
                    converted.id
                );
            }
        );


        return {

            id:
                "HILDA_" +
                pid,

            name:
                "HILDA Spreadsheet",

            locale:
                LocaleType.EN_US,

            styles:
                {},

            sheetOrder:
                sheetOrder,

            sheets:
                sheets

        };
    }


    /* =====================================
       Load saved participant copy
       OR original Excel workbook
       ===================================== */

    try {

        const saved =
            await getSaved();


        const snapshot =
            saved ||
            await loadTemplate();


        const workbook =
            univerAPI.createWorkbook(
                snapshot
            );


        document
            .getElementById(
                "status"
            )
            .style.display =
                "none";


        /* =================================
           Autosave
           ================================= */

        let saveTimer;

/*
        univerAPI.onCommandExecuted(
            function () {

                clearTimeout(
                    saveTimer
                );

                saveTimer =
                    setTimeout(
                        function () {

                            saveWorkbook(
                                workbook.save()
                            );

                        },
                        500
                    );*/
            }
        );


        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "hidden"
                ) {

                    saveWorkbook(
                        workbook.save()
                    );
                }
            }
        );


        window.addEventListener(
            "pagehide",
            function () {

                saveWorkbook(
                    workbook.save()
                );
            }
        );


    } catch (error) {

        console.error(
            error
        );

        document
            .getElementById(
                "status"
            )
            .textContent =

                "Spreadsheet could not be loaded: " +
                error.message;
    }

})();
</script>

</body>
</html>
