<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HILDA Spreadsheet</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
<script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

<script src="https://unpkg.com/@univerjs/presets@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/umd/locales/en-US.js"></script>

<link rel="stylesheet"
href="https://unpkg.com/@univerjs/preset-sheets-core@0.25.0/lib/index.css">

<style>
html, body, #app {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: white;
}

#status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    font-family: Arial, sans-serif;
    z-index: 9999;
}
</style>
</head>

<body>

<div id="app"></div>
<div id="status">Loading spreadsheet...</div>

<script>
(async function () {

    const params = new URLSearchParams(location.search);
    const pid = params.get("pid");

    if (!pid) {
        document.getElementById("status").textContent =
            "Missing participant ID.";
        return;
    }

    /*
     * All seven Qualtrics pages use the SAME workbook.
     * Different participants still have separate saved copies.
     *
     * Change v1 to v2 during testing if you want everybody
     * to start again from a fresh HILDA.xlsx.
     */
    const VERSION = "v1";
    const KEY = "HILDA_" + VERSION + "_" + pid;
    const FILE = "./HILDA_COVID_structured_v3.xlsx";


    /* ---------- IndexedDB ---------- */

    function openDB() {
        return new Promise(function (resolve, reject) {

            const request = indexedDB.open("HILDA_DB", 1);

            request.onupgradeneeded = function (e) {
                const db = e.target.result;

                if (!db.objectStoreNames.contains("workbooks")) {
                    db.createObjectStore("workbooks");
                }
            };

            request.onsuccess = function () {
                resolve(request.result);
            };

            request.onerror = function () {
                reject(request.error);
            };
        });
    }


    async function getSaved() {
        const db = await openDB();

        return new Promise(function (resolve) {

            const request = db
                .transaction("workbooks")
                .objectStore("workbooks")
                .get(KEY);

            request.onsuccess = function () {
                resolve(request.result || null);
            };

            request.onerror = function () {
                resolve(null);
            };
        });
    }


    async function save(snapshot) {
        const db = await openDB();

        const tx = db.transaction(
            "workbooks",
            "readwrite"
        );

        tx.objectStore("workbooks")
          .put(snapshot, KEY);
    }


    /* ---------- Univer ---------- */

    const { createUniver } = UniverPresets;
    const { LocaleType, mergeLocales } = UniverCore;
    const { UniverSheetsCorePreset } = UniverPresetSheetsCore;

    const { univerAPI } = createUniver({

        locale: LocaleType.EN_US,

        locales: {
            [LocaleType.EN_US]:
                mergeLocales(
                    UniverPresetSheetsCoreEnUS
                )
        },

        presets: [
            UniverSheetsCorePreset({
                container: "app"
            })
        ]
    });


    /* ---------- Excel → Univer ---------- */

    function convertSheet(ws, name, index) {

        const cellData = {};
        let rows = 1000;
        let cols = 26;

        Object.keys(ws).forEach(function (address) {

            if (address[0] === "!") return;

            const source = ws[address];
            const pos = XLSX.utils.decode_cell(address);

            rows = Math.max(rows, pos.r + 1);
            cols = Math.max(cols, pos.c + 1);

            if (!cellData[pos.r]) {
                cellData[pos.r] = {};
            }

            const cell = {};

            if (source.f) {
                cell.f = source.f.startsWith("=")
                    ? source.f
                    : "=" + source.f;
            }

            if (source.v !== undefined) {
                cell.v = source.v;
            }

            cellData[pos.r][pos.c] = cell;
        });

        return {
            id: "sheet_" + index,
            name: name,
            rowCount: rows,
            columnCount: cols,
            cellData: cellData
        };
    }


    async function loadTemplate() {

        const response = await fetch(
            FILE,
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Cannot load " + FILE);
        }

        const buffer = await response.arrayBuffer();

        const excel = XLSX.read(
            buffer,
            { cellFormula: true }
        );

        const sheets = {};
        const sheetOrder = [];

        excel.SheetNames.forEach(function (name, index) {

            const converted = convertSheet(
                excel.Sheets[name],
                name,
                index
            );

            sheets[converted.id] = converted;
            sheetOrder.push(converted.id);
        });

        return {
            id: "HILDA_" + pid,
            name: "HILDA Spreadsheet",
            locale: LocaleType.EN_US,
            styles: {},
            sheetOrder: sheetOrder,
            sheets: sheets
        };
    }


    /* ---------- Load / restore ---------- */

    try {

        const saved = await getSaved();

        const snapshot =
            saved || await loadTemplate();

        const workbook =
            univerAPI.createWorkbook(snapshot);

        document.getElementById("status").style.display =
            "none";


        /* ---------- Autosave ---------- */

        let timer;

        univerAPI.onCommandExecuted(function () {

            clearTimeout(timer);

            timer = setTimeout(function () {
                save(workbook.save());
            }, 500);
        });


        document.addEventListener(
            "visibilitychange",
            function () {

                if (document.visibilityState === "hidden") {
                    save(workbook.save());
                }
            }
        );


        window.addEventListener(
            "pagehide",
            function () {
                save(workbook.save());
            }
        );

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "Spreadsheet could not be loaded: " +
            error.message;
    }

})();
</script>

</body>
</html>
